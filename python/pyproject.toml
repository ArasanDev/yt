[project]
name = "yt-transcript"
version = "0.1.0"
description = "YouTube transcripts for agents: caption fast-path with local Whisper fallback. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2025.1.1",
    "mcp>=1.9.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]

[project.scripts]
yt-transcript = "yt_transcript.cli:main"
yt-mcp = "yt_transcript.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript"]
